[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "russian-vocab-desktop"
version = "0.1.0"
description = "Cross-platform desktop app for extracting Russian lemmas from PDF files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "easyocr>=1.7",
    "Pillow>=10.0",
    "platformdirs>=4.2",
    "python-docx>=1.1",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "PySide6>=6.8",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.17"]
dev = ["pytest>=8.0"]

[project.scripts]
russian-vocab-desktop = "russian_vocab_desktop.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
