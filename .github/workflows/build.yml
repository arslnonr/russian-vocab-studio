name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Windows .exe
  # ──────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU-only PyTorch for a smaller Windows bundle
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows .exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name RussianVocabStudio `
            --collect-data pymorphy3_dicts_ru `
            --hidden-import pymorphy3.opencorpora_dict `
            --collect-all docx `
            --collect-all easyocr `
            --collect-all torch `
            --collect-all torchvision `
            --collect-data scipy `
            app.py

      - name: Package as zip
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path RussianVocabStudio -DestinationPath ../RussianVocabStudio-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RussianVocabStudio-Windows
          path: RussianVocabStudio-Windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RussianVocabStudio-Windows.zip
          generate_release_notes: true

  # ──────────────────────────────────────────────────────────────────────
  # macOS .app
  # ──────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS .app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name RussianVocabStudio \
            --osx-bundle-identifier com.arslnonr.russianvocabstudio \
            --collect-data pymorphy3_dicts_ru \
            --hidden-import pymorphy3.opencorpora_dict \
            --collect-all docx \
            --collect-all easyocr \
            --collect-all torch \
            --collect-all torchvision \
            --collect-data scipy \
            app.py

      - name: Strip quarantine + zip the .app
        run: |
          xattr -cr dist/RussianVocabStudio.app
          cd dist
          ditto -c -k --keepParent RussianVocabStudio.app ../RussianVocabStudio-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RussianVocabStudio-macOS
          path: RussianVocabStudio-macOS.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RussianVocabStudio-macOS.zip
          generate_release_notes: true
